<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OffMode</title>
<meta name="description" content="OffMode fjerner manuelt arbejde i din virksomhed. AI- og automatiseringsløsninger til små virksomheder – til en fast, fair pris.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fff; --fg: #000; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --fg: #fff; }
  }
  * { box-sizing: border-box; }
  html { font-size: 17px; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 500px;
    padding: 12vh 1.5rem 4rem;
    text-align: left;
  }
  u { text-underline-offset: 3px; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 1.5rem; }
  p { margin: 0 0 1.5rem; }
  p:last-of-type { margin-bottom: 3rem; }
  a.cta {
    display: inline-block;
    background: var(--fg);
    color: var(--bg);
    text-decoration: none;
    padding: 0.45rem 1rem;
    border-radius: 22px;
  }
  a.cta:hover, a.cta:focus-visible { opacity: 0.8; }
  h2 { font-size: 1.1rem; font-weight: 600; margin: 0 0 1rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { margin: 0 0 0.5rem; }
  li a { color: var(--fg); text-decoration: none; border-bottom: 1px solid currentColor; }
  li a:hover, li a:focus-visible { border-bottom-color: transparent; }
  section { margin-top: 4rem; }
</style>
</head>
<body>
<main>
  <h1>Spar timers arbejde, hver eneste uge.</h1>
  <p><u>OffMode</u> fjerner manuelt arbejde i din virksomhed.</p>
  <p>Book et uforpligtende møde, så vi sammen kan identificere dine største tidsrøvere.</p>
  <a class="cta" href="mailto:kim@offmode.co?subject=Uforpligtende%20m%C3%B8de">Frigør din tid</a>
  <section>
    <h2>Projekter</h2>
    <ul>
      <li><a href="https://viborg-caravancenter.dk">viborg-caravancenter.dk</a></li>
      <li><a href="https://byensentreprenor.dk">byensentreprenor.dk</a></li>
    </ul>
  </section>
</main>
</body>
</html>
