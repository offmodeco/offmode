<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OffMode</title>
<meta name="description" content="OffMode fjerner manuelt arbejde i din virksomhed. AI- og automatiseringsløsninger til små virksomheder – til en fast, fair pris.">
<style>
  :root {
    --bg: #fff;
    --fg: #111;
    --muted: #6b6b6b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e0e0e; --fg: #f2f2f2; --muted: #8a8a8a; }
  }
  * { box-sizing: border-box; }
  html { font-size: 17px; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 500px;
    padding: 4rem 1.5rem;
    text-align: left;
  }
  .brand { color: var(--muted); margin: 0 0 3rem; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 1.5rem; }
  p { margin: 0 0 1.5rem; }
  p:last-of-type { margin-bottom: 3rem; }
  a.cta {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid var(--fg);
    padding-bottom: 2px;
  }
  a.cta:hover, a.cta:focus-visible { border-bottom-color: transparent; }
  a.cta::after { content: " →"; }
</style>
</head>
<body>
<main>
  <p class="brand">OffMode</p>
  <h1>Spar timers arbejde, hver eneste uge.</h1>
  <p>OffMode fjerner manuelt arbejde i din virksomhed.</p>
  <p>Book et uforpligtende møde, så vi sammen kan identificere dine største tidsrøvere.</p>
  <a class="cta" href="mailto:hej@offmode.dk?subject=Uforpligtende%20m%C3%B8de">Frigør din tid</a>
</main>
</body>
</html>
