<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OffMode</title>
<meta name="description" content="OffMode fjerner manuelt arbejde i din virksomhed. AI- og automatiseringsløsninger til små virksomheder – til en fast, fair pris.">
<style>
  :root { --bg: #fff; --fg: #000; }
  * { box-sizing: border-box; }
  html { font-size: 17px; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 500px;
    padding: 12vh 1.5rem 4rem;
    text-align: left;
  }
  u { text-underline-offset: 3px; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 1.5rem; }
  p { margin: 0 0 1.5rem; }
  p:last-of-type { margin-bottom: 3rem; }
  a.cta {
    display: inline-block;
    background: var(--fg);
    color: var(--bg);
    text-decoration: none;
    padding: 0.7rem 1.4rem;
    border-radius: 22px;
  }
  a.cta:hover, a.cta:focus-visible { opacity: 0.8; }
</style>
</head>
<body>
<main>
  <h1>Spar timers arbejde, hver eneste uge.</h1>
  <p><u>OffMode</u> fjerner manuelt arbejde i din virksomhed.</p>
  <p>Book et uforpligtende møde, så vi sammen kan identificere dine største tidsrøvere.</p>
  <a class="cta" href="mailto:hej@offmode.dk?subject=Uforpligtende%20m%C3%B8de">Frigør din tid</a>
</main>
</body>
</html>
