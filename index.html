<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OffMode</title>
<meta name="description" content="OffMode fjerner manuelt arbejde i din virksomhed. AI- og automatiseringsløsninger til små virksomheder – til en fast, fair pris.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fff; --fg: #000; }
  :root[data-theme="dark"] { --bg: #000; --fg: #fff; }
  * { box-sizing: border-box; }
  html { font-size: 17px; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 500px;
    padding: 12vh 1.5rem 4rem;
    text-align: left;
  }
  u { text-underline-offset: 3px; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 1.5rem; }
  p { margin: 0 0 1.5rem; }
  p:last-of-type { margin-bottom: 3rem; }
  a.cta {
    display: inline-block;
    background: var(--fg);
    color: var(--bg);
    text-decoration: none;
    padding: 0.45rem 1rem;
    border-radius: 22px;
  }
  a.cta:hover, a.cta:focus-visible { opacity: 0.8; }
  .toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    width: 2.25rem;
    height: 2.25rem;
    padding: 0;
    border: 0;
    background: none;
    color: var(--fg);
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .toggle:hover, .toggle:focus-visible { opacity: 0.6; }
  .toggle svg { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; }
  .toggle .moon { display: none; }
  :root[data-theme="dark"] .toggle .sun { display: none; }
  :root[data-theme="dark"] .toggle .moon { display: block; }
</style>
<script>
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
</script>
</head>
<body>
<button class="toggle" type="button" aria-label="Skift mellem lys og mørk tilstand">
  <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
</button>
<main>
  <h1>Spar timers arbejde, hver eneste uge.</h1>
  <p><u>OffMode</u> fjerner manuelt arbejde i din virksomhed.</p>
  <p>Book et uforpligtende møde, så vi sammen kan identificere dine største tidsrøvere.</p>
  <a class="cta" href="mailto:kim@offmode.co?subject=Uforpligtende%20m%C3%B8de">Frigør din tid</a>
</main>
<script>
  document.querySelector(".toggle").addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.dataset.theme !== "dark";
    if (dark) root.dataset.theme = "dark"; else delete root.dataset.theme;
    try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
  });
</script>
</body>
</html>
